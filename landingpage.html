<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Form-like Web Form</title>

    <link rel="stylesheet" href="styles.css">
 
</head>
<body>
  <div class="form-container">
    <h2>Employee Details</h2>
    <form action="#" method="post">
      <div class="form-group">
        <label for="full-name">Enter Full Name</label>
        <input type="text" id="full-name" name="full-name" required>
      </div>
      <div class="form-group">
        <label for="contact-number">Contact Number</label>
        <input type="tel" id="contact-number" name="contact-number" required>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" required></textarea>
      </div>
      <div class="form-group">
        <label for="company-name">Company Name</label>
        <input type="text" id="company-name" name="company-name" required>
      </div>
      <div class="form-group">
        <label for="email-address">Email Address</label>
        <input type="email" id="email-address" name="email-address" required>
      </div>
      <div class="form-group">
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="HR">HR</option>
          <option value="Sales">Sales</option>
          <option value="Development">Development</option>
          <option value="Marketing">Marketing</option>
          <option value="Others">Others</option>
        </select>
      </div>
      <div class="form-group">
        <label for="gender-male">Gender</label>
        <div class="radio-group">
          <label><input type="radio" id="gender-male" name="gender" value="Male" required> Male</label>
          <label><input type="radio" id="gender-female" name="gender" value="Female" required> Female</label>
          <label><input type="radio" id="gender-prefer-not-to-say" name="gender" value="Prefer not to say" required> Prefer not to say</label>
        </div>
      </div>
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>
</body>
</html>
